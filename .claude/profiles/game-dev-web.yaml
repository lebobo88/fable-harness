name: game-dev-web
description: >
  A browser-delivered real-time game (three.js / React Three Fiber, Babylon.js, PlayCanvas,
  Phaser). Read by profile-loader.md. Extends the web-ui posture with the concerns that
  only apply to a continuously-rendering canvas app: a hard per-frame budget, GC pressure
  inside the render loop, asset streaming and cache budgets, and the fact that a green
  build proves nothing about what is actually on screen.
extends: ["web-ui"]

detect_signals:
  - "package.json depends on three, @react-three/fiber, babylonjs, playcanvas or phaser"
  - "a requestAnimationFrame-driven render loop exists in src/"
  - "a <canvas> is the app's primary surface rather than DOM components"
  - "src/render, src/scene, src/ecs or src/game directories exist"

posture:
  ui_relevant_agents_active: true
  accessibility_rubric: wcag-2.2.md      # partial applicability — see notes
  performance_rubric: game-perf-budget.md
  judge_strictness: standard

required_taxonomy_emphasis: ["4.4", "4.8", "4.10"]

# Designer/design-system-curator taste dials (1-10), per designer.md's contract.
# A cinematic space game wants high visual drama and generous motion, but restrained
# UI density — HUD clutter is the enemy of an atmospheric render.
design_dials:
  DESIGN_VARIANCE: 8
  MOTION_INTENSITY: 8
  VISUAL_DENSITY: 3

engine_gotchas: .claude/gotchas/web-engines.md
prompt_addenda:
  engineer: .claude/prompt-addenda/engineer-game.md

notes: |
  VERIFICATION POSTURE — the reason this profile exists.

  A canvas game can pass typecheck, lint, every unit test, the production build and the
  bundle budget while displaying a black screen. This is not hypothetical: it is exactly
  what run 20260726-213456-p1-render-foundation did (see memory/invariants.md, 2026-07-26).
  Under this profile, therefore:

    * No producer or judge may state "renders correctly", a frame-rate figure, or
      "console clean" as fact on the strength of a passing build. Those are reported as
      UNVERIFIED-PENDING-OPERATOR-CONFIRMATION unless backed by a capture artifact.
    * The game-perf-budget rubric governs every perf-tagged stage, and it FAILS any perf
      claim made without capture evidence.
    * Agents holding the N8 `mcp__claude-in-chrome__*` exception may gather that evidence
      directly; agents without it must defer to the operator rather than assume.

  ACCESSIBILITY. WCAG applies to the DOM/HUD layer (menus, market screens, settings,
  focus order, contrast) but does NOT map cleanly onto a 3D canvas. Do not mark a canvas
  game WCAG-compliant on the strength of DOM auditing alone; treat the canvas separately
  (remappable input, reduced-motion and reduced-shake options, subtitle support,
  colour-blind-safe signalling that never encodes meaning in hue alone).

  SCOPE. This profile deliberately covers only browser-delivered games. Console
  certification, netcode/rollback and live-ops are real concerns in the wider games
  domain but are out of scope here and have no agents, rubrics or checks in this harness.
  Do not let a run imply coverage this harness does not have.
