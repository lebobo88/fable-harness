name: cli
description: A non-UI CLI/job/service product profile. Read by profile-loader.md.
detect_signals:
  - "bin/ or cmd/ directory with a CLI entrypoint"
  - "no frontend framework dependency found"
posture:
  ui_relevant_agents_active: false
  operator_experience_emphasis: true   # CLI contract docs, operator failure-recovery UX still matter (taxonomy §7 trap)
  judge_strictness: standard
required_taxonomy_emphasis: ["4.8", "4.12", "4.13"]
