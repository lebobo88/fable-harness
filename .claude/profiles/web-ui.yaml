name: web-ui
description: A UI-heavy web product profile. Read by profile-loader.md.
detect_signals:
  - "package.json present with a frontend framework dependency (react/vue/svelte/angular)"
  - "src/components or src/pages directory exists"
posture:
  ui_relevant_agents_active: true      # designer, design-system-curator, visual-regression-runner, browser-validator all engage
  accessibility_rubric: wcag-2.2.md
  judge_strictness: standard
required_taxonomy_emphasis: ["4.4", "4.10"]
